services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: verbtrainer
      POSTGRES_USER: ${DB_USER:-verbtrainer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-verbtrainer}
    volumes: [verbtrainer-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/verbtrainer
      DB_USER: ${DB_USER:-verbtrainer}
      DB_PASSWORD: ${DB_PASSWORD:-verbtrainer}
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
    depends_on:
      db: {condition: service_healthy}
  frontend:
    build: ./frontend
    ports: ["${APP_PORT:-8088}:80"]
    depends_on: [backend]
volumes:
  verbtrainer-data:
